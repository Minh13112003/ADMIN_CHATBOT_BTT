# Đoạn cấu hình THÊM vào cuối file docker/nginx/vinhsang.conf của VinhSang (trên server). Không sửa các khối server của VinhSang.
# Tên miền chatadmin.benthanhtourist.com đi qua proxy Cloudflare (đám mây cam), nên:
#   - Trình duyệt và Zalo chỉ thấy chứng chỉ hợp lệ của Cloudflare.
#   - Cloudflare nối về server qua cổng 443; chế độ SSL/TLS của Cloudflare đặt là "Full".
#   - Server dùng lại chứng chỉ tự ký sẵn có của VinhSang (Cloudflare "Full" chấp nhận). Không cần certbot.
# Muốn chặt hơn về sau: dùng "Cloudflare Origin Certificate" + chế độ "Full (strict)".

# IP khách thật: Cloudflare gửi trong CF-Connecting-IP; không có thì dùng địa chỉ nối tới.
map $http_cf_connecting_ip $btt_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Cần cho WebSocket (Socket.IO)
map $http_upgrade $btt_conn_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chatadmin.benthanhtourist.com;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Ảnh/PDF khách gửi tối đa 20 MB
    client_max_body_size 25M;

    # Docker DNS: nginx vẫn khởi động được khi container btt chưa chạy (VinhSang không bị kéo theo).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $btt_backend http://btt-backend-1:4000;
        proxy_pass $btt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $btt_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        set $btt_backend http://btt-backend-1:4000;
        proxy_pass $btt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $btt_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $btt_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        # Kết nối thời gian thực sống lâu
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        set $btt_web http://btt-web-1:80;
        proxy_pass $btt_web;
        proxy_set_header Host $host;
    }
}
