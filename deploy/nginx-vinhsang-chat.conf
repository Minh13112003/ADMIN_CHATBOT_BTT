# Đoạn cấu hình THÊM vào cuối file docker/nginx/vinhsang.conf của VinhSang (trên server). Không sửa các khối server của VinhSang.
# Đổi chatadmin.benthanhtourist.com thành tên miền thật (bản ghi A của tên miền phải trỏ về IP server).
#
# LÀM THEO 2 GIAI ĐOẠN, vì khối 443 cần chứng chỉ mà chứng chỉ chỉ cấp được khi cổng 80 đã trả lời:
#   Giai đoạn 1: thêm KHỐI A + các map. Nạp lại nginx. Chạy lệnh certbot (xem deploy/HUONG-DAN-DEPLOY.md).
#   Giai đoạn 2: thêm KHỐI B. Nạp lại nginx.

# Cần cho WebSocket (Socket.IO)
map $http_upgrade $btt_conn_upgrade {
    default upgrade;
    ""      close;
}

# ===== KHỐI A: cổng 80 =====
# Trả file xác thực cho Let's Encrypt, còn lại chuyển sang https.
server {
    listen 80;
    listen [::]:80;
    server_name chatadmin.benthanhtourist.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== KHỐI B: cổng 443 (thêm sau khi đã có chứng chỉ) =====
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chatadmin.benthanhtourist.com;

    # Thư mục docker/nginx/ssl của VinhSang được gắn vào /etc/nginx/ssl; certbot ghi chứng chỉ vào đó.
    ssl_certificate     /etc/nginx/ssl/live/chatadmin.benthanhtourist.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/chatadmin.benthanhtourist.com/privkey.pem;

    # Ảnh/PDF khách gửi tối đa 20 MB
    client_max_body_size 25M;

    # Docker DNS: nginx vẫn khởi động được khi container btt chưa chạy (VinhSang không bị kéo theo).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $btt_backend http://btt-backend-1:4000;
        proxy_pass $btt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Nếu đặt tên miền sau Cloudflare (đám mây cam) thì đổi $remote_addr thành $http_cf_connecting_ip
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        set $btt_backend http://btt-backend-1:4000;
        proxy_pass $btt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $btt_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Kết nối thời gian thực sống lâu
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        set $btt_web http://btt-web-1:80;
        proxy_pass $btt_web;
        proxy_set_header Host $host;
    }
}
