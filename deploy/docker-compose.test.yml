# Thử khi CHƯA có tên miền. Chạy chung với file chính:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
# Cổng 8081 chỉ mở trên chính server (127.0.0.1), không ai bên ngoài vào được. Xem từ máy bạn bằng đường hầm SSH:
#   ssh -L 8081:127.0.0.1:8081 <user>@<IP server>
# rồi mở http://localhost:8081 trên trình duyệt (để cửa sổ SSH mở trong lúc dùng).
# Trong deploy/.env đặt tạm FRONTEND_URL=http://localhost:8081
services:
  web:
    volumes:
      - ./nginx-test.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"
