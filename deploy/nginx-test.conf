# CHỈ DÙNG ĐỂ THỬ khi chưa có tên miền (docker-compose.test.yml gắn file này thay cho nginx-web.conf).
# nginx trong container web vừa phục vụ giao diện vừa chuyển /api và /socket.io về backend,
# nên một địa chỉ duy nhất (http://localhost:8081 qua đường hầm SSH) dùng được cả trang lẫn API.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25M;

    # Docker DNS: nginx khởi động được kể cả khi backend chưa chạy.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $be http://btt-backend-1:4000;
        proxy_pass $be;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /socket.io/ {
        set $be http://btt-backend-1:4000;
        proxy_pass $be;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
