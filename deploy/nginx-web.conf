# nginx TRONG container web: chỉ phục vụ file tĩnh của frontend.
# /api và /socket.io do nginx ngoài (của VinhSang) chuyển thẳng tới container backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # File build có hash trong tên: cache lâu. index.html thì không cache để bản mới có hiệu lực ngay.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        # SPA: tải lại /inbox hay /stats đều phải trả index.html.
        try_files $uri /index.html;
    }
}
